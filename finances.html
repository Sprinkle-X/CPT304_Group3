<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", initial-scale=1.0">
    <meta property="og:title" content="BizTrack Project by Sumayyah"/>
    <meta property="og:description" content="A project born out of real small business challenges, now simplifying product, order, and finance management."/>
    <meta property="og:image:secure_url" content="https://i.imgur.com/0O47fVi.jpg"/>
    <meta property="og:url" content="https://sumusa.github.io/biztrack/"/>
    <link rel="stylesheet" href="./styles.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link rel="icon" type="image/x-icon" href="./assets/favicon.ico">
    <title data-i18n="page.expenses.title">Expenses - BizTrack</title>
</head>
<body>
    <div class="language-switcher">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="zh">中文</button>
    </div>
    <div id="sidebar" class="sidebar">
        <div class="logo">
            <a href="./index.html">
                <i class="fas fa-b"></i>
                <span data-i18n="app.name">BizTrack</span>
            </a>
            <button type="button" class="icon-button sidebar-close" aria-label="Close sidebar" onclick="closeSidebar()">
                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
        </div>
        <ul class="menu">
            <li>
                <a href="./index.html">
                    <i class="fa-solid fa-gauge-high"></i>
                    <span data-i18n="nav.dashboard">Dashboard</span>
                </a>
            </li>
            <li>
                <a href="./products.html">
                    <i class="fas fa-dolly"></i>
                    <span data-i18n="nav.products">Products</span>
                </a>
            </li>
            <li>
                <a href="./orders.html">
                    <i class="fas fa-shopping-cart"></i>
                    <span data-i18n="nav.orders">Orders</span>
                </a>
            </li>
            <li class="active">
                <a href="./finances.html">
                    <i class="fas fa-sack-dollar"></i>
                    <span data-i18n="nav.expenses">Expenses</span>
                </a>
            </li>
            <li>
                <a href="./help.html">
                    <i class="fas fa-question-circle"></i>
                    <span data-i18n="nav.help">Help</span>
                </a>
            </li>
            <li class="logout">
                <a href="./about.html">
                    <i class="fa-solid fa-users-line"></i>
                    <span data-i18n="nav.developer">Meet the Developer</span>
                </a>
            </li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header-wrapper">
            <button type="button" class="menu-icon icon-button" aria-label="Open sidebar" onclick="openSidebar()">
                <i class="fa-solid fa-bars" aria-hidden="true"></i>
            </button>
            <div class="header-title">
                <!-- <span>Primary</span> -->
                <h2 data-i18n="nav.expenses">Expenses</h2>
            </div>
            <div class="user-info">
                <div class="search-box">
                    <button type="button" class="search-button" aria-label="Search expenses" data-i18n-aria-label="expenses.searchExpenses" onclick="performSearch()">
                        <i class="fas fa-search" aria-hidden="true"></i>
                    </button>
                    <label class="visually-hidden" for="searchInput" data-i18n="expenses.searchExpenses">Search expenses</label>
                    <input type="search" id="searchInput" placeholder="Search" data-i18n-placeholder="common.search">
                </div>
                <!-- <i class="fas fa-user-alt fa-xl"></i> -->
            </div>
        </div>

        <div class="table-wrapper">
            <div class="product-title">
                <h3 class="main-title" data-i18n="nav.expenses">Expenses</h3>
                <div class="finance-button">
                    <button class="add-button" onclick="openForm()" data-i18n="expenses.addExpense">Add Expense</button>
                    <button class="download-button" onclick="exportToCSV()" data-i18n="common.exportCSV">Export to CSV</button>
                </div>
            </div>

            <div class="form-popup">
                <form class="form-container" id="transaction-form" onsubmit="addOrUpdate(event)">
                    <div class="form-columns">
                            <input type="hidden" id="tr-id">
                            <label for="tr-date"><b data-i18n="expenses.date">Date: </b></label>
                            <input type="date" id="tr-date" required>

                            <label for="tr-category"><b data-i18n="expenses.category">Category: </b></label>
                            <select name="tr-category" id="tr-category" required>
                                <option value="" disabled selected hidden data-i18n="expenses.chooseCategory">Choose an expense category</option>
                                <option value="Rent">Rent</option>
                                <option value="Utilities">Utilities</option>
                                <option value="Supplies">Supplies</option>
                                <option value="Order Fulfillment">Order Fulfillment</option>
                                <option value="Miscellaneous">Miscellaneous</option>
                            </select>

                            <label for="tr-amount"><b data-i18n="expenses.amount">Amount: </b></label>
                            <input type="number" id="tr-amount" placeholder="$0.00" min="0.00" max="10000.00" step="0.01" required>

                            <label for="tr-notes"><b data-i18n="expenses.notes">Notes: </b></label>
                            <input type="text" id="tr-notes" placeholder="Enter notes" data-i18n-placeholder="expenses.notesPlaceholder" required>
                    </div>
                    
                    <div class="button-col">
                        <button type="submit" class="btn" id="submitBtn" data-mode="add" data-i18n="common.add">Add</button>
                        <button type="button" class="btn cancel" onclick="closeForm()" data-i18n="common.cancel">Cancel</button>
                    </div>
                </form>
            </div>

            <div class="table-container">
                <table id="finance-table">
                    <thead>
                        <tr>
                            <th scope="col" aria-sort="none">
                                <button type="button" class="sort-button" onclick="sortTable('trID', this)">
                                    <span data-i18n="expenses.serialNumber">S/N</span>
                                    <i class="fa-solid fa-sort" aria-hidden="true"></i>
                                </button>
                            </th>

                            <th scope="col" aria-sort="none">
                                <button type="button" class="sort-button" onclick="sortTable('trDate', this)">
                                    <span data-i18n="expenses.dateShort">Date</span>
                                    <i class="fa-solid fa-sort" aria-hidden="true"></i>
                                </button>
                            </th>

                            <th scope="col" aria-sort="none">
                                <button type="button" class="sort-button" onclick="sortTable('trCategory', this)">
                                    <span data-i18n="expenses.expenseCategory">Expense Category</span>
                                    <i class="fa-solid fa-sort" aria-hidden="true"></i>
                                </button>
                            </th>

                            <th scope="col" aria-sort="none">
                                <button type="button" class="sort-button" onclick="sortTable('trAmount', this)">
                                    <span data-i18n="expenses.amountShort">Amount</span>
                                    <i class="fa-solid fa-sort" aria-hidden="true"></i>
                                </button>
                            </th>

                            <th scope="col" aria-sort="none">
                                <button type="button" class="sort-button" onclick="sortTable('trNotes', this)">
                                    <span data-i18n="expenses.notesShort">Notes</span>
                                    <i class="fa-solid fa-sort" aria-hidden="true"></i>
                                </button>
                            </th>

                            <th scope="col" data-i18n="common.action">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                    </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="6">
                                <div id="total-expenses"></div>
                            </td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>
    <!-- Cookie Banner -->
    <div id="cookie-banner" class="cookie-banner" role="dialog" aria-label="Cookie consent" hidden>
    <div class="cookie-content">
        <p data-i18n="cookie.message">
        We use necessary cookies to make this website work. With your consent, we may also use non-essential cookies to improve the user experience.
        </p>

        <a href="./privacy.html" class="privacy-link" data-i18n="cookie.privacyLink">
        Privacy Policy
        </a>

        <div class="cookie-actions">
        <button type="button" id="necessary-cookies" data-i18n="cookie.necessaryOnly">
            Necessary Only
        </button>
        <button type="button" id="reject-cookies" data-i18n="cookie.reject">
            Reject
        </button>
        <button type="button" id="accept-cookies" class="accept-btn" data-i18n="cookie.acceptAll">
            Accept All
        </button>
        </div>
    </div>
    </div>

    <script src="./i18n.js"></script>
    <script src="./finances.js"></script>
    <script src="./cookie-consent.js"></script>
</body>
</html>
