<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="BizTrack Project by Sumayyah"/>
    <meta property="og:description" content="A project born out of real small business challenges, now simplifying product, order, and finance management."/>
    <meta property="og:image:secure_url" content="https://i.imgur.com/0O47fVi.jpg"/>
    <meta property="og:url" content="https://sumusa.github.io/biztrack/"/>
    <link rel="stylesheet" href="./styles.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link rel="icon" type="image/x-icon" href="./assets/favicon.ico">
    <title data-i18n="page.products.title">Products - BizTrack</title>
</head>
<body>
    <nav class="language-switcher" aria-label="Language selection">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="zh">中文</button>
    </nav>
    <nav id="sidebar" class="sidebar" aria-label="Primary navigation" tabindex="0">
        <div class="logo">
            <a href="./index.html">
                <i class="fas fa-b"></i>
                <span data-i18n="app.name">BizTrack</span>
            </a>
            <button type="button" class="icon-button sidebar-close" aria-label="Close sidebar" onclick="closeSidebar()">
                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
        </div>
        <ul class="menu">
            <li>
                <a href="./index.html">
                    <i class="fa-solid fa-gauge-high"></i>
                    <span data-i18n="nav.dashboard">Dashboard</span>
                </a>
            </li>
            <li class="active">
                <a href="./products.html">
                    <i class="fas fa-dolly"></i>
                    <span data-i18n="nav.products">Products</span>
                </a>
            </li>
            <li>
                <a href="./orders.html">
                    <i class="fas fa-shopping-cart"></i>
                    <span data-i18n="nav.orders">Orders</span>
                </a>
            </li>
            <li>
                <a href="./finances.html">
                    <i class="fas fa-sack-dollar"></i>
                    <span data-i18n="nav.expenses">Expenses</span>
                </a>
            </li>
            <li>
                <a href="./help.html">
                    <i class="fas fa-question-circle"></i>
                    <span data-i18n="nav.help">Help</span>
                </a>
            </li>
            <li class="logout">
                <a href="./about.html">
                    <i class="fa-solid fa-users-line"></i>
                    <span data-i18n="nav.developer">Meet the Developer</span>
                </a>
            </li>
        </ul>
    </nav>

    <main class="main-content">
        <div class="header-wrapper">
            <button type="button" class="menu-icon icon-button" aria-label="Open sidebar" onclick="openSidebar()">
                <i class="fa-solid fa-bars" aria-hidden="true"></i>
            </button>
            <div class="header-title">
                <!-- <span>Primary</span> -->
                <h1 data-i18n="nav.products">Products</h1>
            </div>
            <div class="user-info">
                <div class="search-box">
                    <button type="button" class="search-button" aria-label="Search products" data-i18n-aria-label="products.searchProducts" onclick="performSearch()">
                        <i class="fas fa-search" aria-hidden="true"></i>
                    </button>
                    <label class="visually-hidden" for="searchInput" data-i18n="products.searchProducts">Search products</label>
                    <input type="search" id="searchInput" placeholder="Search" data-i18n-placeholder="common.search">
                </div>
                <!-- <i class="fas fa-user-alt fa-xl"></i> -->
            </div>
        </div>

        <div class="table-wrapper">
            <div class="product-title">
                <h2 class="main-title" data-i18n="nav.products">Products</h2>
                <div class="product-button">
                    <button class="add-button" onclick="openForm()" data-i18n="products.addProduct">Add Product</button>
                    <button class="download-button" onclick="exportToCSV()" data-i18n="common.downloadCSV">Download CSV</button>
                </div>
            </div>
            <div class="form-popup">
                <form class="form-container" id="product-form" onsubmit="addOrUpdate(event)">
                    <div class="form-columns">
                        <div class="first-col">
                            <label for="product-id"><b data-i18n="products.productId">Product ID: </b></label>
                            <input type="text" id="product-id" placeholder="PD001" required>
                        
                            <label for="product-name"><b data-i18n="products.productName">Product Name</b></label>
                            <select name="product-name" id="product-name" required>
                                <option value="" disabled selected hidden data-i18n="products.chooseProduct">Choose a product</option>
                                <optgroup label="Hats">
                                    <option value="Baseball caps">Baseball caps</option>
                                    <option value="Snapbacks">Snapbacks</option>
                                    <option value="Beanies">Beanies</option>
                                    <option value="Bucket hats">Bucket hats</option>
                                </optgroup>
                                <optgroup label="Drinkware">
                                    <option value="Mugs">Mugs</option>
                                    <option value="Water bottles">Water bottles</option>
                                    <option value="Tumblers">Tumblers</option>
                                </optgroup>   
                                <optgroup label="Clothing">
                                    <option value="T-shirts">T-shirts</option>
                                    <option value="Sweatshirts">Sweatshirts</option>
                                    <option value="Hoodies">Hoodies</option>
                                </optgroup>   
                                <optgroup label="Accessories">
                                    <option value="Pillow cases">Pillow cases</option>
                                    <option value="Tote bags">Tote bags</option>
                                    <option value="Stickers">Stickers</option>
                                </optgroup>   
                                <optgroup label="Home decor">
                                    <option value="Posters">Posters</option>
                                    <option value="Framed posters">Framed posters</option>
                                    <option value="Canvas prints">Canvas prints</option>
                                </optgroup>
                            </select>
    
                            <label for="product-desc"><b data-i18n="products.productDescription">Product Description:</b></label>

                            <input type="text"id="product-desc" data-i18n-placeholder="products.productDescPlaceholder" placeholder="Enter product description" required>
                        </div>
                        <div class="second-col">
                            <label for="product-cat"><b data-i18n="products.productCategory">Product Category:</b></label>
                            <select name="product-cat" id="product-cat" required>
                                <option value="" disabled selected data-i18n="products.chooseCategory">Choose a category</option>
                                <option value="Clothing">Clothing</option>
                                <option value="Drinkware">Drinkware</option>
                                <option value="Accessories">Accessories</option>
                                <option value="Hats">Hats</option>
                                <option value="Home decor">Home decor</option>
                            </select>
    
                            <label for="product-price"><b data-i18n="products.productPrice">Product Price:</b></label>
                            <input type="number" id="product-price" placeholder="$0.00" min="0.00" max="10000.00" step="0.01" required>
    
                            <label for="product-sold"><b data-i18n="products.unitsSold">Number of Units Sold:</b></label>
                            <input type="number" id="product-sold" placeholder="1" required>
                        </div>
                    </div>
                    
                    <div class="button-col">
                        <button type="submit" class="btn" id="submitBtn" data-i18n="common.add">Add</button>
                        <button type="button" class="btn cancel" onclick="closeForm()" data-i18n="common.cancel">Cancel</button>
                    </div>
                </form>
            </div>
            <div class="table-container" tabindex="0" aria-label="Scrollable products table">
                <table id="product-table">
                    <thead>
                        <tr>
                            <th scope="col" aria-sort="none">
                                <button type="button" class="sort-button" onclick="sortTable('prodID', this)">
                                    <span data-i18n="products.productId">Product ID</span>
                                    <i class="fa-solid fa-sort" aria-hidden="true"></i>
                                </button>
                            </th>

                            <th scope="col" aria-sort="none">
                                <button type="button" class="sort-button" onclick="sortTable('prodName', this)">
                                    <span data-i18n="products.productName">Product Name</span>
                                    <i class="fa-solid fa-sort" aria-hidden="true"></i>
                                </button>
                            </th>

                            <th scope="col" aria-sort="none">
                                <button type="button" class="sort-button" onclick="sortTable('prodDesc', this)">
                                    <span data-i18n="products.description">Description</span>
                                    <i class="fa-solid fa-sort" aria-hidden="true"></i>
                                </button>
                            </th>

                            <th scope="col" aria-sort="none">
                                <button type="button" class="sort-button" onclick="sortTable('prodCat', this)">
                                    <span data-i18n="products.category">Category</span>
                                    <i class="fa-solid fa-sort" aria-hidden="true"></i>
                                </button>
                            </th>

                            <th scope="col" aria-sort="none">
                                <button type="button" class="sort-button" onclick="sortTable('prodPrice', this)">
                                    <span data-i18n="products.price">Price</span>
                                    <i class="fa-solid fa-sort" aria-hidden="true"></i>
                                </button>
                            </th>

                            <th scope="col" aria-sort="none">
                                <button type="button" class="sort-button" onclick="sortTable('prodSold', this)">
                                    <span data-i18n="products.unitsSoldShort">Units Sold</span>
                                    <i class="fa-solid fa-sort" aria-hidden="true"></i>
                                </button>
                            </th>

                            <th scope="col" data-i18n="common.action">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                    </tbody>
                    <!-- <tfoot>
                        <tr>
                            <td colspan="11"><a href="#">View more orders</a></td>
                        </tr>
                    </tfoot> -->
                </table>
            </div>
        </div>
    </main>
    <!-- Cookie Banner -->
    <aside id="cookie-banner" class="cookie-banner" aria-label="Cookie consent" hidden>
    <div role="dialog" aria-label="Cookie consent">
    <div class="cookie-content">
        <p data-i18n="cookie.message">
        We use necessary cookies to make this website work. With your consent, we may also use non-essential cookies to improve the user experience.
        </p>

        <a href="./privacy.html" class="privacy-link" data-i18n="cookie.privacyLink">
        Privacy Policy
        </a>

        <div class="cookie-actions">
        <button type="button" id="necessary-cookies" data-i18n="cookie.necessaryOnly">
            Necessary Only
        </button>
        <button type="button" id="reject-cookies" data-i18n="cookie.reject">
            Reject
        </button>
        <button type="button" id="accept-cookies" class="accept-btn" data-i18n="cookie.acceptAll">
            Accept All
        </button>
        </div>
    </div>
    </div>
    </aside>

    <script src="./i18n.js"></script>
    <script src="./products.js"></script>
    <script src="./cookie-consent.js"></script>
</body>
</html>
